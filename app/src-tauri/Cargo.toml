[package]
name = "plughive-app"
version = "0.1.0"
description = "PlugHive tray app for macOS, Windows and Linux"
edition = "2021"
rust-version = "1.90"
publish = false

[[bin]]
name = "plughive-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-notification = "=2.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

# macOS keeps its own single-instance lock and socket in the private data
# directory (src/main.rs, mod instance): the plugin's socket is in /tmp.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "=2.5.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
